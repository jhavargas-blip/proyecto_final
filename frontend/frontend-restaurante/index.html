<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Restaurante XYZ</h1>
        </header>
        <main>
            <section id="login-view">
                <h2>Iniciar sesión</h2>
                <form id="form-login">
                    <div>
                        <label for="username">Usuario / Correo:</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>
                    <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <p id="login-error" style="color:red; display:none; margin-top:1rem; text-align:center;"></p>
            </section>
            <section id="dashboard-view" style="display:none;">
                <div style="text-align:center; padding:2rem;">
                    <p>Redirigiendo al panel...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
