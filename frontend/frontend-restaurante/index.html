<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Restaurante <span>XYZ</span></h1>
            <p>Sistema de Reservas y Pedidos</p>
        </header>
        <main>
            <section id="login-view">
                <div class="login-card">
                    <div class="login-header">
                        <h2>Iniciar Sesión</h2>
                        <p>Ingresa tus credenciales para acceder al panel</p>
                    </div>
                    
                    <form id="form-login" novalidate>
                        <div class="form-group">
                            <label for="username">Usuario / Correo</label>
                            <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin o admin@restaurante.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary">Entrar al Panel</button>
                    </form>

                    <div id="login-error" class="error-message" style="display:none;"></div>

                    <div class="demo-credentials">
                        <strong>🧪 Credenciales de prueba (clic para autollenar):</strong>
                        <code>admin</code> / <code>admin123</code> <span style="color:#95a5a6;">(Administrador)</span><br>
                        <code>empleado</code> / <code>empleado123</code> <span style="color:#95a5a6;">(Empleado)</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
