<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ - Sistema de Reservas y Pedidos</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Restaurante XYZ</h1>
            <nav id="nav-auth" style="display:none;">
                <span id="user-info"></span>
                <button id="btn-logout">Cerrar sesión</button>
            </nav>
        </header>
        <main>
            <section id="login-view">
                <h2>Iniciar sesión</h2>
                <form id="form-login">
                    <div>
                        <label for="username">Usuario / Correo:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <p id="login-error" style="color:red; display:none;"></p>
            </section>
            <section id="dashboard-view" style="display:none;">
                <h2>Panel principal</h2>
                <div id="dashboard-content">Bienvenido al sistema</div>
            </section>
        </main>
    </div>
    <script src="js/login.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
